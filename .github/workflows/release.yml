name: Release gem

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build gem
        run: gem build vagrant-notify-forwarder2.gemspec

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push vagrant-notify-forwarder2-*.gem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vagrant-notify-forwarder2-*.gem
          body: |
            vagrant-notify-forwarder2 ${{ github.ref_name }}

            ## Install
            ```
            vagrant plugin install vagrant-notify-forwarder2
            ```
