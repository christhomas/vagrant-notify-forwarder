name: Release gem

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Inject binary checksums
        run: |
          CONFIG=lib/vagrant-notify-forwarder/config.rb
          for pair in \
            "linux_x86_64:SHA256_LINUX_X86_64" \
            "linux_arm64:SHA256_LINUX_ARM64" \
            "linux_armv7l:SHA256_LINUX_ARMV7L" \
            "darwin_x86_64:SHA256_DARWIN_X86_64" \
            "darwin_arm64:SHA256_DARWIN_ARM64"; do
            binary="${pair%%:*}"
            placeholder="${pair##*:}"
            url="https://github.com/christhomas/notify-forwarder/releases/download/v1.1.0/notify-forwarder-${binary}"
            sha256=$(curl -fsSL "$url" | sha256sum | awk '{print $1}')
            echo "  ${binary}: ${sha256}"
            sed -i "s/${placeholder}/${sha256}/" "$CONFIG"
          done
          echo "--- config.rb after injection ---"
          grep -A1 'NOTIFY_FORWARDER_BASE_URL.*notify-forwarder-' "$CONFIG"

      - name: Verify no placeholders remain
        run: |
          if grep -q 'SHA256_' lib/vagrant-notify-forwarder/config.rb; then
            echo "ERROR: unreplaced SHA256 placeholders found"
            grep 'SHA256_' lib/vagrant-notify-forwarder/config.rb
            exit 1
          fi

      - name: Build gem
        run: gem build vagrant-notify-forwarder.gemspec

      - name: Configure RubyGems trusted publisher
        uses: rubygems/configure-rubygems-credentials@main
        with:
          gem-server: https://rubygems.org
          audience: rubygems.org

      - name: Publish to RubyGems
        run: gem push vagrant-notify-forwarder-christhomas-*.gem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vagrant-notify-forwarder-christhomas-*.gem
          body: |
            vagrant-notify-forwarder-christhomas ${{ github.ref_name }}

            ## Install
            ```
            vagrant plugin install vagrant-notify-forwarder-christhomas
            ```
